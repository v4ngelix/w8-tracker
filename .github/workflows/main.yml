name: Deploy to Website

on:
  push:
      branches:
        - main

jobs:
  deploy:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H boheemia.ee >> ~/.ssh/known_hosts

      - name: Update application and restart
        run: |
          ssh virt65914@boheemia.ee "\
            cd domeenid/www.boheemia.ee/w8/ && \
            echo 'In directory:' && pwd && \
            ls && \
            if [ -f package.json ]; then \
              echo 'Running backup...' && \
              npm run backup || echo 'Backup failed, continuing anyway'; \
            fi \
            nvm use || true && \
            npm i || true && \
            pm2 delete w8-tracker || true && \
            pm2 save --force && \
            pm2 start ./server/application.ts --interpreter=node --node-args='--env-file=./configurations/.env' --watch --name=w8-tracker"
