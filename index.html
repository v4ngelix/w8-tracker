<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>W8-Tracker</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link id="favicon" rel="icon" type="image/png" href="/assets/chart-decreasing.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>

  <body>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <div class="demo-mode-frame">Demo mode</div>
    <main>
      <header>
        <div class="header__retro-logo-effect">
          <h1>W</h1>
          <h1>W</h1>
          <h1>W</h1>
          <h1>W</h1>
          <h1>W</h1>
          <h1>8-Tracker</h1>
        </div>
        <h2 class="header__subtitle">Track it, then hack it</h2>
      </header>

      <div class="w8__controls">
        <div class="w8__controls__add-record">
          <div class="w8__add-record__weight">
            <label for="weightInput">Weight:</label>
            <input
              required
              type="number"
              name="weight"
              id="weightInput"
              placeholder="Weight"
              min="50"
              max="110"
              step="0.01"
            >
          </div>
          <div class="w8__add-record__date">
            <label for="dateInput" style="grid-column: span 2">Date:</label>
            <input
              required
              type="date"
              name="date"
              id="dateInput"
              placeholder="Date"
            >
          </div>
          <div class="w8__add-record__submit">
            <!-- If adding is fixed, could try the traditional way of submitting via "onsubmit=/endpoint" -->
            <button
              type="button"
              onclick="addWeight()"
            >
              Submit weight
            </button>
          </div>
        </div>

        <div class="w8__settings">
          <button
            type="button"
            class="w8__settings__toggle"
            aria-label="Settings"
            aria-haspopup="true"
            aria-expanded="false"
            onclick="toggleSettings()"
          >
            <svg viewBox="0 0 512 512" width="16" height="16" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M495 327l-36-21a206 206 0 0 0 0-92l36-21a13 13 0 0 0 6-15 263 263 0 0 0-58-100 13 13 0 0 0-16-3l-36 21a201 201 0 0 0-80-46V21a13 13 0 0 0-10-13 266 266 0 0 0-116 0 13 13 0 0 0-10 13v42a201 201 0 0 0-80 46L65 75a13 13 0 0 0-16 3 263 263 0 0 0-58 100 13 13 0 0 0 6 15l36 21a206 206 0 0 0 0 92l-36 21a13 13 0 0 0-6 15 263 263 0 0 0 58 100 13 13 0 0 0 16 3l36-21a201 201 0 0 0 80 46v42a13 13 0 0 0 10 13 266 266 0 0 0 116 0 13 13 0 0 0 10-13v-42a201 201 0 0 0 80-46l36 21a13 13 0 0 0 16-3 263 263 0 0 0 58-100 13 13 0 0 0-6-15zM256 336a80 80 0 1 1 0-160 80 80 0 0 1 0 160z"/>
            </svg>
          </button>

          <div class="w8__settings__panel" id="settingsPanel" role="dialog" aria-label="Settings" hidden>
            <h3 class="w8__settings__title">Settings</h3>

            <div class="w8__settings__row">
              <div class="w8__settings__label-group">
                <span class="w8__settings__label">BMI color zones</span>
                <span class="w8__settings__hint">Color the chart background by BMI band</span>
              </div>
              <label class="w8__settings__switch">
                <input type="checkbox" id="settingBmiBackground" onchange="updateSetting('bmiBackground', this.checked)">
                <span class="w8__settings__slider"></span>
              </label>
            </div>

            <div class="w8__settings__row">
              <div class="w8__settings__label-group">
                <label class="w8__settings__label" for="settingHistoryRange">History range</label>
                <span class="w8__settings__hint">How much past data to chart</span>
              </div>
              <select id="settingHistoryRange" onchange="updateSetting('historyRange', this.value)">
                <option value="all">All time</option>
                <option value="5y">Last 5 years</option>
                <option value="1y">Last year</option>
                <option value="6m">Last 6 months</option>
                <option value="3m">Last 3 months</option>
              </select>
            </div>

            <div class="w8__settings__row">
              <div class="w8__settings__label-group">
                <label class="w8__settings__label" for="settingYAxisMode">Weight axis</label>
                <span class="w8__settings__hint">Vertical scale of the chart</span>
              </div>
              <select id="settingYAxisMode" onchange="updateSetting('yAxisMode', this.value)">
                <option value="auto">Fit to data</option>
                <option value="custom">Custom</option>
              </select>
            </div>

            <div class="w8__settings__row w8__settings__row--sub" id="settingTargetRow">
              <div class="w8__settings__label-group">
                <label class="w8__settings__label" for="settingTargetWeight">Target weight</label>
                <span class="w8__settings__hint">Kept in view on the axis (kg)</span>
              </div>
              <input
                type="number"
                id="settingTargetWeight"
                min="30"
                max="200"
                step="0.5"
                onchange="updateSetting('targetWeight', Number(this.value))"
              >
            </div>
          </div>
        </div>
      </div>

      <div class="w8__chart">
        <div id="weightTimeSeriesChart"></div>
        <div id="chartTooltip" class="w8__chart__tooltip" role="tooltip" hidden></div>
      </div>

      <table>
        <thead>
          <tr>
            <th
              class="sortable-column-header"
              onclick="handleTableSort('weight')"
            >
              <div>
                <div class="w8__table__column-label">
                  <img
                    src="/assets/weight-hanging-solid.svg"
                    alt="Weight icon"
                    class="w8__table__column-icon"
                  >
                  Weight
                </div>
                <div id="sort-by-weight-icon"></div>
              </div>
            </th>
            <th>
              <div>
                <div class="w8__table__column-label">
                  <img
                    src="/assets/change.svg"
                    alt="Weight icon"
                    class="w8__table__column-icon"
                  >
                  Change
                </div>
                <div id="sort-by-difference-icon"></div>
              </div>
            </th>
            <th
              class="sortable-column-header"
              onclick="handleTableSort('date')"
            >
              <div>
                <div class="w8__table__column-label">
                  <img
                    src="/assets/calendar-check-regular.svg"
                    alt="Date icon"
                    class="w8__table__column-icon"
                  >
                  Date
                </div>
                <span id="sort-by-date-icon">▼</span>
              </div>
            </th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4" style="text-align: center">
              - No data -
            </td>
          </tr>
        </tbody>
      </table>
    </main>
    <script src="/scripts/main.js"></script>
  </body>
</html>
