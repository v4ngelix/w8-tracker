<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>W8-Tracker</title>
    <link rel="stylesheet" href="/styles/main.css">
  </head>

  <body>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

    <main>
      <header>
        <div class="header__retro-logo-effect">
          <h1 style="color: #ffd36f; z-index: 1">W</h1>
          <h1 style="left: 6px; color: #FFA41B; z-index: 2">W</h1>
          <h1 style="left: 12px; color: #F86F03; z-index: 3">W</h1>
          <h1 style="left: 18px; color: #525FE1; z-index: 4">W</h1>
          <h1 style="left: 24px; z-index: 5">W8-Tracker</h1>
        </div>
        <h2>Track it, then hack it</h2>
      </header>

      <form>
        <div class="form__element">
          <label for="weightInput">Weight:</label>
          <input
            required
            type="number"
            name="weight"
            id="weightInput"
            placeholder="Weight"
            min="50"
            max="110"
            step="0.01"
          >
        </div>

        <div class="form__element">
          <label for="dateInput">Date:</label>
          <input
            required
            type="date"
            name="date"
            id="dateInput"
            placeholder="Date"
          >
        </div>

        <!-- If adding is fixed, could try the traditional way of submitting via "onsubmit=/endpoint" -->
        <div class="form__element">
          <label style="height: .75rem; padding: .125rem;"></label>
          <button
            type="button"
            onclick="addWeight()"
          >
            Submit weight
          </button>
        </div>
      </form>

      <div id="weightTimeSeriesChart"></div>

      <table>
        <thead>
          <tr>
            <th class="sortable-column-header" onclick="handleTableSort('weight')">
              <div>
                <img
                  src="/assets/weight-hanging-solid.svg"
                  alt="Weight icon">
                <span>
                  Weight
                </span>
                <span id="sort-by-weight-icon"></span>
              </div>
            </th>
            <!-- Not actually sortable yet -->
            <th class="sortable-column-header" onclick="handleTableSort('difference')">
              <div>
                <img
                  src="/assets/weight-hanging-solid.svg"
                  alt="Weight icon">
                <span>
                  Difference from previous
                </span>
                <span id="sort-by-difference-icon"></span>
              </div>
            </th>
            <th class="sortable-column-header" onclick="handleTableSort('date')">
              <div>
                <img
                  src="/assets/calendar-check-regular.svg"
                  alt="Date icon"
                >
                <span>
                  Date
                </span>
                <span id="sort-by-date-icon">▼</span>
              </div>
            </th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4" style="text-align: center">
              - No data -
            </td>
          </tr>
        </tbody>
      </table>
    </main>
    <script src="/scripts/main.js"></script>
  </body>
</html>
