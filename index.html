<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>W8-Tracker</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link id="favicon" rel="icon" type="image/png" href="/assets/chart-decreasing.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>

  <body>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <div class="demo-mode-frame">Demo mode</div>
    <main>
      <header>
        <div class="header__retro-logo-effect">
          <h1>W</h1>
          <h1>W</h1>
          <h1>W</h1>
          <h1>W</h1>
          <h1>W</h1>
          <h1>8-Tracker</h1>
        </div>
        <h2 class="header__subtitle">Track it, then hack it</h2>
      </header>

      <div class="w8__add-weight__controls-container">
        <div class="w8__add-weight__control">
          <label for="weightInput">Weight:</label>
          <input
            required
            type="number"
            name="weight"
            id="weightInput"
            placeholder="Weight"
            min="50"
            max="110"
            step="0.01"
          >
        </div>
        <div class="w8__add-weight__control">
          <label for="dateInput" style="grid-column: span 2">Date:</label>
          <input
            required
            type="date"
            name="date"
            id="dateInput"
            placeholder="Date"
          >
        </div>
        <div class="w8__add-weight__control">
          <!-- If adding is fixed, could try the traditional way of submitting via "onsubmit=/endpoint" -->
          <button
            type="button"
            onclick="addWeight()"
          >
            Submit weight
          </button>
        </div>
      </div>

      <div id="weightTimeSeriesChart"></div>

      <table>
        <thead>
          <tr>
            <th
              class="sortable-column-header"
              onclick="handleTableSort('weight')"
            >
              <div>
                <img
                  src="/assets/weight-hanging-solid.svg"
                  alt="Weight icon"
                  class="w8__table__column-icon"
                >
                <span class="w8__table__column-label">
                  Weight
                </span>
                <span id="sort-by-weight-icon"></span>
              </div>
            </th>
            <th>
              <div>
                <img
                  src="/assets/change.svg"
                  alt="Weight icon"
                  class="w8__table__column-icon"
                >
                <span class="w8__table__column-label">
                  Change
                </span>
                <span id="sort-by-difference-icon"></span>
              </div>
            </th>
            <th
              class="sortable-column-header"
              onclick="handleTableSort('date')"
            >
              <div>
                <img
                  src="/assets/calendar-check-regular.svg"
                  alt="Date icon"
                  class="w8__table__column-icon"
                >
                <span class="w8__table__column-label">
                  Date
                </span>
                <span id="sort-by-date-icon">▼</span>
              </div>
            </th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="4" style="text-align: center">
              - No data -
            </td>
          </tr>
        </tbody>
      </table>
    </main>
    <script src="/scripts/main.js"></script>
  </body>
</html>
